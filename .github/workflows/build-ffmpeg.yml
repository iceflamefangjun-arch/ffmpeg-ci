name: Build FFmpeg

on:
  workflow_dispatch:
    inputs:
      variant:
        description: FFmpeg build variant
        required: true
        default: player
        type: choice
        options:
          - player
          - live
      arch:
        description: Target architecture
        required: true
        default: x64
        type: choice
        options:
          - x64
          - x86
          - arm64
      build_type:
        description: Build type
        required: true
        default: static
        type: choice
        options:
          - release
          - debug
          - static
      run_all_configs:
        description: Run all player/live x86/x64 debug/release/static configs
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: ${{ matrix.variant }} ${{ matrix.arch }} ${{ matrix.build_type }}
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.run_all_configs && '{"include":[{"variant":"player","arch":"x86","build_type":"debug"},{"variant":"player","arch":"x86","build_type":"release"},{"variant":"player","arch":"x86","build_type":"static"},{"variant":"player","arch":"x64","build_type":"debug"},{"variant":"player","arch":"x64","build_type":"release"},{"variant":"player","arch":"x64","build_type":"static"},{"variant":"live","arch":"x86","build_type":"debug"},{"variant":"live","arch":"x86","build_type":"release"},{"variant":"live","arch":"x86","build_type":"static"},{"variant":"live","arch":"x64","build_type":"debug"},{"variant":"live","arch":"x64","build_type":"release"},{"variant":"live","arch":"x64","build_type":"static"}]}' || format('{{"include":[{{"variant":"{0}","arch":"{1}","build_type":"{2}"}}]}}', inputs.variant, inputs.arch, inputs.build_type)) }}

    env:
      FFMPEG_REPO_URL: ${{ vars.FFMPEG_REPO_URL }}
      FDK_AAC_REPO_URL: ${{ vars.FDK_AAC_REPO_URL }}
      X264_REPO_URL: ${{ vars.X264_REPO_URL }}
      MIRROR_REPO_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
      # Buffer each make target's output in a file before forwarding it to tee.
      # Native clang-cl can report ENOSPC when an MSYS2 pipe buffer fills up.
      MAKEFLAGS: --output-sync=target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          path-type: inherit
          install: >-
            base-devel
            git
            curl
            zip
            unzip
            cmake
            pkgconf
            python
            nasm
            autoconf
            automake
            libtool

      - name: Resolve Visual Studio and SDK paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw 'Visual Studio with MSVC tools was not found on the runner.'
          }

          $msvcRoot = Join-Path $vsPath 'VC\Tools\MSVC'
          $msvcVersion = Get-ChildItem -LiteralPath $msvcRoot -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $msvcVersion) {
            throw "MSVC toolset directory was not found under $msvcRoot."
          }

          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $sdkVersion = Get-ChildItem -LiteralPath (Join-Path $sdkRoot 'Include') -Directory |
            Where-Object {
              (Test-Path -LiteralPath (Join-Path $_.FullName 'um')) -and
              (Test-Path -LiteralPath (Join-Path $sdkRoot "Lib\$($_.Name)\um"))
            } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdkVersion) {
            throw "Windows 10 SDK include/lib directories were not found under $sdkRoot."
          }

          $llvmRoots = @(
            'C:\Program Files\LLVM'
            (Join-Path $vsPath 'VC\Tools\Llvm\x64')
          )
          $llvmRoot = $llvmRoots | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ 'bin\clang-cl.exe')
          } | Select-Object -First 1
          if (-not $llvmRoot) {
            throw 'LLVM clang-cl was not found on the runner.'
          }

          function Convert-ToForwardSlash([string]$Path) {
            return ($Path -replace '\\', '/')
          }

          @(
            "LLVM_ROOT=$(Convert-ToForwardSlash $llvmRoot)"
            "WINSDKINC=$(Convert-ToForwardSlash (Join-Path $sdkRoot "Include\$($sdkVersion.Name)"))"
            "WINSDKLIB=$(Convert-ToForwardSlash (Join-Path $sdkRoot "Lib\$($sdkVersion.Name)"))"
            "VCINC=$(Convert-ToForwardSlash (Join-Path $msvcVersion.FullName 'include'))"
            "VCLIB=$(Convert-ToForwardSlash (Join-Path $msvcVersion.FullName 'lib'))"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate mirror configuration
        shell: msys2 {0}
        run: |
          set -euo pipefail

          if [ -z "${FFMPEG_REPO_URL:-}" ]; then
            echo "::warning::FFMPEG_REPO_URL is not set; ffmpeg/b.sh will use its built-in default mirror."
          fi

          if [ "${{ matrix.variant }}" = "live" ]; then
            if [ -z "${FDK_AAC_REPO_URL:-}" ]; then
              echo "::warning::FDK_AAC_REPO_URL is not set; fdk-aac/b.sh will use its built-in default mirror."
            fi
            if [ -z "${X264_REPO_URL:-}" ]; then
              echo "::warning::X264_REPO_URL is not set; x264/b.sh will use its built-in default mirror."
            fi
          fi

      - name: Configure Git mirror access
        shell: msys2 {0}
        run: |
          set -euo pipefail

          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          deps="$(cygpath -u "$RUNNER_TEMP")/ffmpeg-src"
          if [ -n "${MIRROR_REPO_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${MIRROR_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            git config --global url."https://x-access-token:${MIRROR_REPO_TOKEN}@github.com/".insteadOf "git@github.com:"
          fi
          git config --global --add safe.directory "$workspace"
          mkdir -p "$deps"

      - name: Build FFmpeg
        shell: msys2 {0}
        run: |
          set -euo pipefail

          variant='${{ matrix.variant }}'
          arch='${{ matrix.arch }}'
          buildType='${{ matrix.build_type }}'

          if [ "$variant" = "live" ] && [ "$arch" = "arm64" ]; then
            echo "ARM64 is supported by the player build only." >&2
            exit 1
          fi

          script='build-all.sh'
          if [ "$variant" = "live" ]; then
            script='build-all-live.sh'
          fi

          export CLANG_SHELL_WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          export DEPENDSPATH="$(cygpath -u "$RUNNER_TEMP")/ffmpeg-src"
          export TOOLCHAIN="$(cygpath -u "$LLVM_ROOT")"

          # Import the MSVC / Windows SDK paths discovered by the prior PowerShell step
          # and expose them as Windows paths so clang-cl/lld-link can find headers & libs.
          export WINSDKINC="${WINSDKINC:-}"
          export WINSDKLIB="${WINSDKLIB:-}"
          export VCINC="${VCINC:-}"
          export VCLIB="${VCLIB:-}"

          # env_config.sh discovers and exports INCLUDE/LIB itself, so we only
          # need to forward the raw path variables from the PowerShell step.
          export PATH="$TOOLCHAIN/bin:$PATH"

          echo "TOOLCHAIN=$TOOLCHAIN"
          echo "VCINC=$VCINC"
          echo "VCLIB=$VCLIB"
          echo "WINSDKINC=$WINSDKINC"
          echo "WINSDKLIB=$WINSDKLIB"
          "$TOOLCHAIN/bin/clang-cl" --version
          "$TOOLCHAIN/bin/lld-link" --version

          echo "::group::Disk space before build"
          df -h
          echo "::endgroup::"

          cd "$CLANG_SHELL_WORKSPACE"
          chmod +x "$script"
          ./"$script" "$arch" "$buildType"

          echo "::group::Disk space after build"
          df -h
          echo "::endgroup::"

      - name: Print ffmpeg diagnostics on failure
        if: failure()
        shell: msys2 {0}
        run: |
          set -euo pipefail
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          deps="$(cygpath -u "$RUNNER_TEMP")/ffmpeg-src"
          found=0
          echo "::group::Disk space at failure"
          df -h
          echo "::endgroup::"
          build_dirs=(
            "$workspace/ffmpeg/build"
            "$deps/ffmpeg/build"
            "$deps/ffmpeg"
          )
          config_logs=(
            "$workspace/ffmpeg/build/ffbuild/config.log"
            "$deps/ffmpeg/build/ffbuild/config.log"
            "$deps/ffmpeg/ffbuild/config.log"
          )
          config_maks=(
            "$workspace/ffmpeg/build/ffbuild/config.mak"
            "$deps/ffmpeg/build/ffbuild/config.mak"
            "$deps/ffmpeg/ffbuild/config.mak"
          )

          for config_log in "${config_logs[@]}"; do
            if [ -f "$config_log" ]; then
              found=1
              echo "===== ffmpeg config.log: $config_log ====="
              cat "$config_log"
              echo "===== end config.log ====="
            else
              echo "config.log not found at $config_log"
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "No ffmpeg config.log files were found."
          fi

          for config_mak in "${config_maks[@]}"; do
            if [ -f "$config_mak" ]; then
              echo "===== ffmpeg config.mak toolchain: $config_mak ====="
              grep -E '^(ARCH|CC|LD|WINDRES)=' "$config_mak" || true
              echo "===== end config.mak toolchain ====="
            else
              echo "config.mak not found at $config_mak"
            fi
          done

          for build_dir in "${build_dirs[@]}"; do
            if [ -d "$build_dir" ]; then
              echo "===== ffmpeg resource object diagnostics: $build_dir ====="
              while IFS= read -r -d '' obj; do
                echo "--- $obj"
                if command -v file >/dev/null 2>&1; then
                  file "$obj" || true
                fi
                if command -v llvm-readobj >/dev/null 2>&1; then
                  llvm-readobj --file-headers "$obj" | sed -n '1,40p' || true
                fi
              done < <(find "$build_dir" -name '*res.o' -print0 2>/dev/null)
              echo "===== end resource object diagnostics ====="
            else
              echo "build dir not found at $build_dir"
            fi
          done

      - name: Upload FFmpeg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.variant }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.run_number }}
          path: |
            ffmpeg-7.1.1-${{ matrix.arch }}-${{ matrix.build_type }}-*.zip
            ffmpeg-live-7.1.1-${{ matrix.arch }}-${{ matrix.build_type }}-*.zip
          if-no-files-found: error
          retention-days: 14
